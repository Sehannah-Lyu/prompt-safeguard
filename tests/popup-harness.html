<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="../popup.css" />
    <title>Prompt Safeguard Popup Harness</title>
    <script>
      const calls = [];
      let permission = false;
      window.chrome = {
        tabs: {
          async query() { return [{ id: 7, url: "https://claude.ai/chat/test-conversation" }]; },
          async sendMessage(tabId, message) { calls.push(["message", tabId, message.type]); return { ok: true }; }
        },
        permissions: {
          async contains() { return permission; },
          async request(value) { calls.push(["request", value.origins[0]]); permission = true; return true; },
          async remove(value) { calls.push(["remove", value.origins[0]]); permission = false; return true; }
        },
        scripting: {
          async getRegisteredContentScripts() { return []; },
          async unregisterContentScripts(value) { calls.push(["unregister", value.ids[0]]); },
          async registerContentScripts(value) { calls.push(["register", value[0].matches[0]]); },
          async insertCSS(value) { calls.push(["css", value.files.join(",")]); },
          async executeScript(value) { calls.push(["script", value.files.join(",")]); }
        }
      };
    </script>
  </head>
  <body>
    <main>
      <header><span class="monogram">P</span><div><div class="eyebrow">PROMPT SAFEGUARD</div><strong>Site Access</strong></div><span class="version">3.1.1</span></header>
      <section class="site-card"><div class="site-topline"><span class="site-adapter" id="site-adapter">正在识别…</span><span class="site-mode" id="site-mode"></span></div><h1 id="site-host">当前网站</h1><p id="site-description">检查权限。</p></section>
      <section class="permission-status" id="permission-status" data-state="loading"><span class="signal"></span><span id="status-copy">正在检查权限…</span></section>
      <div class="actions"><button class="primary" id="primary-action" type="button" disabled>请稍候</button><button class="secondary" id="pick-editor" type="button" hidden>重新选择输入框</button><button class="quiet" id="disable-site" type="button" hidden>在此网站停用</button></div>
      <p class="privacy">本地测试。</p><p class="message" id="message" role="status"></p>
    </main>
    <script src="../adapters.js"></script>
    <script src="../site-manager.js"></script>
    <script src="../popup.js"></script>
  </body>
</html>
