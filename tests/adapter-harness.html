<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8" /><title>Adapter Harness</title></head>
  <body>
    <h1>Adapter contract harness</h1>
    <section data-fixture="chatgpt"><div id="prompt-textarea" role="textbox" contenteditable="true"></div></section>
    <section data-fixture="claude"><div class="ProseMirror" role="textbox" contenteditable="true"></div></section>
    <section data-fixture="doubao"><textarea placeholder="输入消息"></textarea></section>
    <section data-fixture="gemini"><rich-textarea><div class="ql-editor" role="textbox" contenteditable="true"></div></rich-textarea></section>
    <section data-fixture="deepseek"><textarea></textarea></section>
    <ul id="results"></ul>
    <script src="../adapters.js"></script>
    <script>
      const registry = window.PromptSafeguardAdapters;
      const results = document.querySelector("#results");
      registry.adapters.forEach((adapter) => {
        const fixture = document.querySelector(`[data-fixture="${adapter.id}"]`);
        const editor = registry.findEditor(adapter, fixture);
        const item = document.createElement("li");
        item.dataset.adapter = adapter.id;
        item.textContent = `${adapter.id}:${editor ? "found" : "missing"}`;
        results.appendChild(item);
      });
    </script>
  </body>
</html>
