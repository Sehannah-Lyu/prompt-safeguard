<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Prompt Safeguard Test Harness</title>
    <style>
      body { min-height: 100vh; margin: 0; background: #f7f7f5; color: #20201c; font-family: sans-serif; }
      .page { max-width: 720px; margin: 80px auto; }
      .composer-tray { position: fixed; left: 50%; bottom: 36px; width: min(720px, calc(100vw - 48px)); transform: translateX(-50%); }
      form { padding: 18px; background: white; border: 1px solid #ddd; border-radius: 26px; box-shadow: 0 12px 30px rgba(0,0,0,.08); }
      #prompt-textarea { min-height: 48px; outline: 0; white-space: pre-wrap; }
    </style>
    <script>
      const memory = JSON.parse(sessionStorage.getItem("psHarnessStore") || "{}");
      const persist = () => sessionStorage.setItem("psHarnessStore", JSON.stringify(memory));
      window.__psStore = memory;
      window.chrome = {
        runtime: {
          lastError: null,
          onMessage: { addListener(listener) { window.__psMessageListener = listener; } }
        },
        storage: {
          local: {
            get(keys, callback) {
              const list = Array.isArray(keys) ? keys : [keys];
              const result = {};
              list.forEach((key) => { if (Object.prototype.hasOwnProperty.call(memory, key)) result[key] = memory[key]; });
              queueMicrotask(() => callback(result));
            },
            set(values, callback) { Object.assign(memory, values); persist(); queueMicrotask(() => callback?.()); },
            remove(keys, callback) { (Array.isArray(keys) ? keys : [keys]).forEach((key) => delete memory[key]); persist(); queueMicrotask(() => callback?.()); }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="../content.css" />
  </head>
  <body>
    <main class="page">
      <h1>Prompt Safeguard 测试页</h1>
      <p>模拟 ChatGPT 输入框，用于验证悬浮工作台和本地存储流程。</p>
    </main>
    <div class="composer-tray">
      <form>
        <div id="prompt-textarea" role="textbox" contenteditable="true"></div>
      </form>
    </div>
    <script src="../core.js"></script>
    <script src="../adapters.js"></script>
    <script src="../content.js"></script>
  </body>
</html>
